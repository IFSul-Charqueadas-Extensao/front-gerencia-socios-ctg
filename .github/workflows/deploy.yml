name: CD Pipeline Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ti/site-php/www/front-gerencia-socios-ctg
            git pull origin main
            npm install
            npm run build
            
            # Cria a pasta final se não existir, limpa ela e joga o código novo lá
            mkdir -p /home/ti/site-php/www/ctg-raizes
            rm -rf /home/ti/site-php/www/ctg-raizes/*
            cp -r dist/* /home/ti/site-php/www/ctg-raizes/
