name: CD Pipeline Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Navega até a pasta do repositório no servidor
            cd /home/ti/site-php/www/front-gerencia-socios-ctg

            # 2. Baixa as atualizações do código-fonte
            git pull origin main

            # 3. Instala pacotes novos
            npm install

            # 4. Compila o projeto otimizado para produção (Vite)
            npm run build
